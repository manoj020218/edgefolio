[platformio]
default_envs = esp32-s3-wroom-1-n16r8

[env:esp32-s3-wroom-1-n16r8]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=0
  -std=gnu++17
build_src_filter =
  +<*>
  -<ap_diag.cpp>
monitor_filters =
  esp32_exception_decoder

[env:ap-diag-s3]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
  -<*>
  +<ap_diag.cpp>
