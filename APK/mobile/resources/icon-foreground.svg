    <rect x="322" y="298" width="70" height="428" rx="14"/>
    <rect x="322" y="298" width="380" height="70" rx="14"/>
    <rect x="322" y="477" width="309" height="70" rx="14"/>
    <rect x="322" y="656" width="380" height="70" rx="14"/>
  </g>
</svg>
