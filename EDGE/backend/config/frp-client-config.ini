[common]
# VPS address where frps is running (shared with edgeye project)
server_addr = 154.61.69.200
server_port = 7000
# Must match the token in frps.ini on VPS
token = change-me-to-frps-token

# Each EDGE installation gets a unique subdomain.
# Set EDGE_ID in .env to match the subdomain below.
# Result: <subdomain>.edgefolio.iotsoft.in → this machine:7001
[edgefolio-api]
type = http
local_ip = 127.0.0.1
local_port = 7001
# Change this to your company's unique ID (same as EDGE_ID in .env)
subdomain = edgefolio-local
