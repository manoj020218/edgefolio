# Add inside the existing `server { server_name edgefolio.iotsoft.in; ... }` block that listens on
# 443 (in /etc/nginx/sites-enabled/edgefolio), above `location / { ... }`.
# The trailing slashes strip the /cloud prefix, so the app serves its routes at its own root.
location /cloud/ {
    proxy_pass         http://127.0.0.1:3090/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}
