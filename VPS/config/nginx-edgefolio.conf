# Nginx config for edgefolio.iotsoft.in
# Place this at: /etc/nginx/sites-available/edgefolio
# Then: sudo ln -s /etc/nginx/sites-available/edgefolio /etc/nginx/sites-enabled/edgefolio
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name edgefolio.iotsoft.in;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name edgefolio.iotsoft.in;

    # SSL (Let's Encrypt — run: certbot --nginx -d edgefolio.iotsoft.in)
    ssl_certificate     /etc/letsencrypt/live/edgefolio.iotsoft.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgefolio.iotsoft.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy to the Node.js marketing server (port 3080)
    location / {
        proxy_pass         http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/edgefolio.access.log;
    error_log  /var/log/nginx/edgefolio.error.log;
}
